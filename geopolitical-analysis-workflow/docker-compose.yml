version: '3.8'

services:
  # 数据库服务
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: geopostgres
    environment:
      POSTGRES_DB: geopolitical
      POSTGRES_USER: geopolitical_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geopolitical_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geopolitical_user -d geopolitical"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - geopolitical-network

  # Redis缓存和消息队列
  redis:
    image: redis:7-alpine
    container_name: georedis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_pass}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - geopolitical-network

  # 对象存储（MinIO S3兼容）
  minio:
    image: minio/minio:latest
    container_name: geominio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"  # API端口
      - "9001:9001"  # 控制台端口
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - geopolitical-network

  # 监控服务 - Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: geoprometheus
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    networks:
      - geopolitical-network
    restart: unless-stopped

  # 监控服务 - Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: geografana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana-dashboards:/etc/grafana/provisioning/dashboards
      - ./config/grafana-datasources:/etc/grafana/provisioning/datasources
    ports:
      - "3000:3000"
    networks:
      - geopolitical-network
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy

  # ELK Stack - Elasticsearch
  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: geoelasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - geopolitical-network
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"'"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ELK Stack - Logstash
  logstash:
    image: logstash:8.11.0
    container_name: geologstash
    volumes:
      - ./config/logstash.conf:/usr/share/logstash/pipeline/logstash.conf
    ports:
      - "5000:5000"  # TCP输入
      - "5001:5001/udp"  # UDP输入
    networks:
      - geopolitical-network
    depends_on:
      elasticsearch:
        condition: service_healthy

  # ELK Stack - Kibana
  kibana:
    image: kibana:8.11.0
    container_name: geokibana
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    networks:
      - geopolitical-network
    depends_on:
      elasticsearch:
        condition: service_healthy

  # 主API服务（开发模式）
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: geoapi
    environment:
      DATABASE_URL: postgresql://geopolitical_user:${POSTGRES_PASSWORD:-geopolitical_pass}@postgres:5432/geopolitical
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_pass}@redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - geopolitical-network
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload

  # 工作流引擎（开发模式）
  workflow:
    build:
      context: .
      dockerfile: Dockerfile.workflow
    container_name: geoworkflow
    environment:
      DATABASE_URL: postgresql://geopolitical_user:${POSTGRES_PASSWORD:-geopolitical_pass}@postgres:5432/geopolitical
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_pass}@redis:6379/0
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - geopolitical-network
    command: python -m src.workflow.orchestrator.main

  # 前端开发服务器
  frontend:
    build:
      context: ./src/web/frontend
      dockerfile: Dockerfile.frontend
    container_name: geofrontend
    volumes:
      - ./src/web/frontend:/app
      - /app/node_modules
    ports:
      - "3001:3000"
    environment:
      REACT_APP_API_URL: http://localhost:8000
    networks:
      - geopolitical-network
    command: npm start

volumes:
  postgres_data:
  redis_data:
  minio_data:
  prometheus_data:
  grafana_data:
  elasticsearch_data:

networks:
  geopolitical-network:
    driver: bridge