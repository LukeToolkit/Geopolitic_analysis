input {
  # TCP输入（来自应用日志）
  tcp {
    port => 5000
    codec => json_lines
    tags => ["application"]
  }

  # UDP输入（来自系统日志）
  udp {
    port => 5001
    codec => json_lines
    tags => ["system"]
  }

  # 文件输入（来自容器日志）
  file {
    path => "/var/log/containers/*.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    tags => ["container"]
    codec => json_lines
  }

  # Beats输入（来自Filebeat）
  beats {
    port => 5044
    tags => ["beats"]
  }
}

filter {
  # 通用字段处理
  if "application" in [tags] {
    # 解析应用日志
    grok {
      match => { "message" => "%{TIMESTAMP_ISO8601:timestamp} %{LOGLEVEL:level} %{GREEDYDATA:message}" }
    }

    # 添加应用类型
    mutate {
      add_field => { "app_type" => "geo_analysis" }
    }
  }

  # 处理系统日志
  if "system" in [tags] {
    grok {
      match => { "message" => "%{SYSLOGTIMESTAMP:timestamp} %{SYSLOGHOST:hostname} %{DATA:program}(?:\[%{POSINT:pid}\])?: %{GREEDYDATA:message}" }
    }
  }

  # 处理容器日志
  if "container" in [tags] {
    # 解析Docker日志格式
    grok {
      match => { "message" => "{\"log\":\"%{GREEDYDATA:log_message}\",\"stream\":\"%{DATA:stream}\",\"time\":\"%{TIMESTAMP_ISO8601:timestamp}\"}" }
    }

    mutate {
      replace => { "message" => "%{log_message}" }
      remove_field => ["log_message"]
    }
  }

  # 时间戳处理
  date {
    match => ["timestamp", "ISO8601", "yyyy-MM-dd HH:mm:ss,SSS", "yyyy/MM/dd HH:mm:ss"]
    target => "@timestamp"
  }

  # 地理IP处理（如果有IP字段）
  if [client_ip] {
    geoip {
      source => "client_ip"
      target => "geoip"
    }
  }

  # 用户代理解析（如果有user_agent字段）
  if [user_agent] {
    useragent {
      source => "user_agent"
      target => "user_agent_info"
    }
  }

  # 数据质量检查
  if [level] {
    # 将日志级别标准化
    mutate {
      gsub => [
        "level", "DEBUG", "DEBUG",
        "level", "INFO", "INFO",
        "level", "WARN", "WARN",
        "level", "ERROR", "ERROR",
        "level", "FATAL", "FATAL"
      ]
    }
  }

  # 敏感信息过滤
  mutate {
    gsub => [
      # 过滤密码
      "message", "(?i)password[=:]\s*\S+", "password=[FILTERED]",
      # 过滤API密钥
      "message", "(?i)(api[_-]?key|secret|token)[=:]\s*\S+", "$1=[FILTERED]",
      # 过滤信用卡号
      "message", "\b\d{4}[- ]?\d{4}[- ]?\d{4}[- ]?\d{4}\b", "[CREDIT_CARD_FILTERED]"
    ]
  }
}

output {
  # 输出到Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "geo-logs-%{+YYYY.MM.dd}"
    user => "${ELASTICSEARCH_USER}"
    password => "${ELASTICSEARCH_PASSWORD}"
    template => "/usr/share/logstash/templates/logstash-template.json"
    template_name => "geo-logs"
    template_overwrite => true
  }

  # 调试输出（仅开发环境）
  if [level] == "DEBUG" {
    stdout {
      codec => rubydebug
    }
  }

  # 错误日志单独存储
  if [level] in ["ERROR", "FATAL"] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "geo-error-logs-%{+YYYY.MM.dd}"
      user => "${ELASTICSEARCH_USER}"
      password => "${ELASTICSEARCH_PASSWORD}"
    }
  }

  # 监控指标输出到Prometheus（通过HTTP端点）
  http {
    url => "http://prometheus:9090/api/v1/write"
    http_method => "post"
    format => "json"
    message => '{"type":"log_count","level":"%{[level]}","count":1}'
    headers => {
      "Content-Type" => "application/json"
    }
  }
}